[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubtree"
version = "1.0.0"
description = "One tree for every Claude Code session you run: parents, children, tasks, budgets and results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dev Kewlani" }]
dependencies = ["textual>=0.80", "rich>=13"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hubtree = "hubtree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hubtree = ["*.txt.gz", "teams/*.toml", "skills/**/*", "pane/**/*", "pane/.claude-plugin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
